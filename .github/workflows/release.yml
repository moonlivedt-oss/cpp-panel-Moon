name: Release

# Релиз по тегу вида v3.0.0: собрать пакет и приложить его к релизу на GitHub.
# Публикацию в маркетплейс НЕ делаем автоматически: она требует токена издателя и осознанного
# решения. Когда токен появится, достаточно раскомментировать последние шаги.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # можно запустить руками из вкладки Actions

permissions:
  contents: write      # нужно, чтобы приложить .vsix к релизу

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Полная проверка перед выпуском: синтаксис модулей + смоук. Зависимостей нет.
      # Релиз со сломанной сборкой хуже отсутствия релиза.
      - name: Проверки
        run: npm run check

      - name: Сборка .vsix
        run: node scripts/package-extension.js

      - name: Версия пакета совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./extension/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией расширения $PKG"
            exit 1
          fi

      - name: Приложить пакет к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true

      - name: Сохранить пакет как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          retention-days: 30

      # Публикация в маркетплейс и OpenVSX — когда будут токены в секретах репозитория:
      # - run: npx @vscode/vsce publish --packagePath dist/*.vsix -p ${{ secrets.VSCE_PAT }}
      # - run: npx ovsx publish dist/*.vsix -p ${{ secrets.OVSX_PAT }}
