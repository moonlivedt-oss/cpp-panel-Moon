name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Проверка модулей, смоук-тест и целостность ссылок. Зависимостей нет (npm ci не нужен) —
  # node --check ловит синтаксис в каждом файле, смоук ловит рантайм после активации
  # расширения в заглушке vscode, check-links ловит битые внутренние ссылки в docs/.
  # Всё прогоняется одной командой npm run check.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Синтаксис модулей + смоук + ссылки
        run: npm run check

  # Компиляция примеров кода из docs/. Самодостаточные блоки C++ (в блоке есть #include и
  # int main) собираются синтаксически (-fsyntax-only, без .exe) — ловит примеры, которые
  # перестали собираться. Метка <!-- docs:no-compile --> исключает намеренно-ошибочные блоки.
  #
  # Раннер — Windows + MSYS2 UCRT64, тот же тулчейн, что у пользователя: примеры включают
  # <windows.h> (SetConsoleCP для русской консоли), которого на Linux нет. Node ставим из msys2,
  # чтобы node и g++ были в одном окружении, а шаги идут в шелле msys2.
  docs-code:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 UCRT64 (g++ + node)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nodejs
      - name: Версия g++ и node
        run: g++ --version && node --version
      - name: Компиляция примеров кода
        run: npm run check:code

  # Линт: eslint — dev-зависимость (рантайм по-прежнему ноль зависимостей). Ставим и гоняем.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установить eslint
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint

  # Упаковщик .vsix — свой ZIP-writer поверх zlib. Отдельным джобом проверяем, что пакет
  # собирается и в dist/ появляется непустой .vsix (иначе установка бы сломалась молча).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать пакет
        run: node scripts/package-extension.js
      - name: Проверить, что .vsix собран
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::.vsix не собран — упаковщик ничего не положил в dist/"
            exit 1
          fi
          ls -l "${files[@]}"
