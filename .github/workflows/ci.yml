name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Всё, что проверяет `npm run check`: сборка рантайма из частей и якорь SHA-256, типы (tsc по
  # JSDoc), тесты node:test (смоук, инъекция, рантайм, мост, вкладка, прогресс, стиль, fuzz, загрузчик),
  # ссылки, согласованность, @id и бюджет производительности. На трёх ОС: пути file:///, поиск
  # workbench.html, хук удаления и закрепление окна устроены на них по-разному.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Проверки (npm run check)
        run: npm run check
      - name: Линт
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run lint

  # Покрытие кода хоста расширения тестами (встроенное в node:test).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Покрытие
        run: npm run test:coverage | tee coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  # Интеграционные тесты в настоящем VS Code (@vscode/test-electron): скачанный stable, фазы
  # basic → inject → window (окно впечатывается в ЭТУ копию VS Code и должно выйти на мост).
  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS: правка ресурсов внутри .app может задеть подпись — фаза окна там «мягкая».
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: VS Code (Linux, виртуальный экран)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode -- --window --download
      - name: VS Code
        if: runner.os != 'Linux'
        run: npm run test:vscode -- --window --download

  # Визуальная регрессия окна (Playwright): эталоны снимков коммитятся для Windows.
  visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Снимки окна
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/

  # Компиляция примеров кода из docs/. Раннер — Windows + MSYS2 UCRT64, тот же тулчейн, что у
  # пользователя: примеры включают <windows.h> (SetConsoleCP для русской консоли). Node — из msys2.
  docs-code:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 UCRT64 (g++ + node)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nodejs
      - name: Версия g++ и node
        run: g++ --version && node --version
      - name: Компиляция примеров кода
        run: npm run check:code
      # «предскажи вывод» и шаги «По шагам» сверяются с настоящим выводом, эталоны test/solutions/
      # проходят тесты «напиши и запусти».
      - name: Ответы интерактивных заданий
        run: npm run check:challenges
      - name: Решения задачника
        run: npm run check:zadachnik
      # «Напиши и запусти» по-настоящему: компиляция, очередь, кэш сборки, зависшая программа.
      - name: Запуск кода (node:test)
        run: node --test test/run.test.js

  # Упаковщик .vsix — свой ZIP-writer поверх zlib: пакет собирается, в dist/ — непустой .vsix.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Собрать пакет
        run: node scripts/package-extension.js
      - name: Проверить, что .vsix собран
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::.vsix не собран — упаковщик ничего не положил в dist/"
            exit 1
          fi
          ls -l "${files[@]}"
